[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"


[tool.uv]
package = false

[project]
name = "research-agent"
version = "0.1.0"
description = "Multi-Tool Research Agent with tool selection and response caching"
requires-python = ">=3.11"
dependencies = [
    "arxiv>=4.0.0",
    "ddgs>=9.14.4",
    "fastapi>=0.136.3",
    "numexpr>=2.14.1",
    "openai>=2.38.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "tiktoken>=0.13.0",
    "uvicorn>=0.49.0",
    "wikipedia-api>=0.15.0",
    "youtube-transcript-api>=1.2.4",
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]
ignore = ["E501"]
exclude = [".git", ".venv", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
